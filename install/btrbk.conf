# btrbk config for this laptop.
# Installed to /etc/btrbk/btrbk.conf by install/btrbk.sh.
#
# Local snapshots always; remote send only when the target is reachable
# (btrbk skips unreachable targets, so this is safe to run every hour).
# Full remote instructions: install/POST_INSTALL.md -> "Backups (btrbk)".

transaction_log /var/log/btrbk.log
lockfile /var/lock/btrbk.lock

# Local retention: 3 daily + 1 weekly + 1 monthly. "latest" min keeps us from
# hoarding hourly snapshots (default is "all" = keep forever, which eats disk).
snapshot_preserve_min latest
snapshot_preserve 3d 1w 1m

# The btrfs pool, mounted at its top-level subvolume (subvolid=5) from fstab.
volume /mnt/btr_pool
    snapshot_dir btrbk_snapshots

    subvolume @
        snapshot_name root

    subvolume @home
        snapshot_name home

    # ---- REMOTE BACKUP (opt-in). Uncomment ONE of these blocks, then set the
    # matching values in /etc/btrbk/backup.env. The target must be btrfs.
    #
    # Home-LAN SSH server (btrfs + btrbk installed on it):
    #   ssh_uri admin@192.168.1.50
    #   target  /srv/btrbk
    #   target_preserve_min no
    #   target_preserve 3d 1w 3m    # remote keeps MORE (3 monthly)
    #
    # USB btrfs disk mounted at /mnt/backup:
    #   target  /mnt/backup/btrbk
    #   target_preserve_min no
    #   target_preserve 3d 1w 3m
