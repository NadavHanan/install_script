# foot config — mirror of dotfiles/kitty/kitty.conf (Tokyo Night, Cascadia Code),
# written for current foot (colors-dark / colors.cursor / [csd] schema).
# Read by foot at ~/.config/foot/foot.ini. Nothing here installs foot.

[colors-dark]
background=000000
foreground=c0caf5
regular0=32344a
regular1=f7768e
regular2=9ece6a
regular3=e0af68
regular4=7aa2f7
regular5=ad8ee6
regular6=449dab
regular7=787c99
bright0=444b6a
bright1=ff7a93
bright2=b9f27c
bright3=ff9e64
bright4=7da6ff
bright5=bb9af7
bright6=0db9d7
bright7=acb0d0
selection-foreground=c0caf5
selection-background=7aa2f7
urls=7aa2f7
# kitty: cursor #c0caf5, cursor_text_color #1a1b26.
# foot: "<text color> <cursor box color>".
cursor=1a1b26 c0caf5

[main]
# kitty: font_family "Cascadia Code", font_size 12
font=Cascadia Code:size=12
# kitty: window_padding_width/height 0
pad=0x0

[csd]
# kitty: hide_window_decorations yes -> hide the CSD titlebar (border-width is 0)
size=0

[key-bindings]
# kitty: map F11 toggle_fullscreen
fullscreen=F11
